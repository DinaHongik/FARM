[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-reproducibility"
version = "2.0.1"
description = "FARM source code, reported benchmark results, and reproducible IFTTT examples"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "FARM authors"}]
dependencies = []

[project.scripts]
farm = "farm_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
